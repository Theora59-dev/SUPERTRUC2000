[package]
name = "supertruc2000"
version = "0.1.0"
description = "Atelier de découpe et de préparation de grands modèles 3D pour l'impression"
authors = ["SUPERTRUC 2000"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "supertruc2000_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = "0.30"
earcutr = "0.4"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.38"
thiserror = "2"
rayon = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
